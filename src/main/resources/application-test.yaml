spring:
  #MySQL配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://host.docker.internal:3306/testdb?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
  # Redis配置
  data:
    redis:
      host: host.docker.internal
      port: 6379      # 端口
      password:       # 密码（无则留空）
      database: 0     # 数据库索引（默认0）
      lettuce: # 连接池（Lettuce 是 Spring Boot 默认客户端）
        pool:
          max-active: 8   # 最大连接数
          max-idle: 8     # 最大空闲连接
          min-idle: 0     # 最小空闲连接
          max-wait: -1ms  # 连接等待时间（-1 表示无限制）